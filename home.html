<!DOCTYPE html>
<html lang="en">

<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Calculator</title>
</head>

<body>
 <section class="display section">
  <input type="text" name="display" value="0" readonly>
 </section>
 <section class="button section">
  <button class="clear">AC</button>
  <button class="percentage">%</button>
  <button class="backspace">Back</button>
  <button class="division">÷</button>

  <button>7</button>
  <button>8</button>
  <button>9</button>
  <button class="multiplication">×</button>

  <button>4</button>
  <button>5</button>
  <button>6</button>
  <button class="substraction">-</button>

  <button>1</button>
  <button>2</button>
  <button>3</button>
  <button class="addition">+</button>

  <button>00</button>
  <button>0</button>
  <button>.</button>
  <button class="result">=</button>
 </section>
</body>

</html>
